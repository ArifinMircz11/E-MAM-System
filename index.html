    <title>e-Mam System V8.0 Aplikasi Madrasah Modern Hebat Bermartabat</title>
    
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow: hidden;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.1) 0%, #020617 100%);
      }
      .loader-glass {
        width: 100px;
        height: 100px;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        margin-bottom: 24px;
        position: relative;
        animation: pulse 3s infinite ease-in-out;
      }
      .loader-logo {
        width: 70px;
        height: 70px;
        object-fit: contain;
      }
      .loader-badge {
        padding: 8px 20px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .loader-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loader-text {
        font-size: 10px;
        font-weight: 800;
        color: white;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.96); opacity: 0.8; }
        50% { transform: scale(1.04); opacity: 1; }
      }
    </style>

    <script>
      (function() {
        const isViteNoise = (msg) => {
          if (!msg) return false;
          let s = '';
          if (typeof msg === 'string') {
            s = msg;
          } else if (msg && typeof msg === 'object') {
            if (typeof msg.message === 'string') {
              s = msg.message;
            } else {
              try {
                s = JSON.stringify(msg);
              } catch (e) {
                s = String(msg);
              }
            }
          } else {
            s = String(msg);
          }
          const lower = s.toLowerCase();
          return lower.includes('[vite]') || lower.includes('websocket') || lower.includes('hmr') || lower.includes('aistudio') || lower.includes('firebase') || lower.includes('firestore') || lower.includes('failed to load resource: the server responded with a status of 429') || lower.includes('no id or name found in config') || lower.includes('err_connection_timed_out') || lower.includes('origin trial') || lower.includes('violates the following content security policy') || lower.includes('editor.main.js') || lower.includes('could not create web worker') || lower.includes('unrecognized feature') || lower.includes('failed to load resource:');
        };

        const originalInfo = console.info;
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        const serializeArg = (arg) => {
          if (arg instanceof Error) return arg.stack || arg.message;
          if (typeof arg === 'object' && arg !== null) {
            try {
              return JSON.stringify(arg, null, 2);
            } catch (e) {
              return String(arg);
            }
          }
          return arg;
        };

        console.info = (...args) => { if (!args.some(isViteNoise)) originalInfo.apply(console, args.map(serializeArg)); };
        console.log = (...args) => { if (!args.some(isViteNoise)) originalLog.apply(console, args.map(serializeArg)); };
        console.error = (...args) => { if (!args.some(isViteNoise)) originalError.apply(console, args.map(serializeArg)); };
        console.warn = (...args) => { if (!args.some(isViteNoise)) originalWarn.apply(console, args.map(serializeArg)); };

        window.addEventListener('unhandledrejection', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (typeof e.stopImmediatePropagation === 'function') {
            e.stopImmediatePropagation();
          }
          const reason = e.reason;
          const msg = reason instanceof Error ? (reason.stack || reason.message) : (typeof reason === 'object' && reason !== null ? (reason.message || JSON.stringify(reason)) : String(reason || ''));
          if (!isViteNoise(msg)) {
            console.warn('[Handled Promise Rejection]:', msg);
          }
        }, true);

        window.addEventListener('error', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (typeof e.stopImmediatePropagation === 'function') {
            e.stopImmediatePropagation();
          }
          const err = e.error || e.message;
          const msg = err instanceof Error ? (err.stack || err.message) : (typeof err === 'object' && err !== null ? (err.message || JSON.stringify(err)) : String(err || ''));
          if (!isViteNoise(msg)) {
            console.warn('[Handled Error]:', msg);
          }
        }, true);
      })();
    </script>

      <div class="loader-glass">
