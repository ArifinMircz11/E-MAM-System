name: Security Hardening

on:
  push:
    branches: [main, hardening/login-e2e-security]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  p0-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: P0 security hardening audit
        run: node scripts/audit/security-hardening.cjs
